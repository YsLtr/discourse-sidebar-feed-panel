name: Check userscript

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:dev
      - run: npm run build
      - run: npm run check:artifact
      - run: npm run check:scroll -- --label ci
      - run: npm run check:browser
